# Display stack: CONFIG_DISPLAY pulls the ST7789V driver in via devicetree
# (ST7789V selects MIPI_DBI; MIPI_DBI_SPI selects SPI), so nothing else is
# needed for the panel itself.
CONFIG_DISPLAY=y

# LVGL UI. Color depth 16 + RGB565 byte swap come from the board's
# Kconfig.defconfig, not from here.
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# Backlight: on this board GPIO46 gates a FET that is pulled OFF at reset,
# so the app must drive LEDC channel 0 or the panel stays dark.
CONFIG_PWM=y

# On-board WS2812B RGB LED on SPI2 (driver defaults on from devicetree)
CONFIG_LED_STRIP=y

# Driver warnings/errors on the USB Serial/JTAG console
CONFIG_LOG=y

# =============================================================================
#  esp32s3_devkitc - the carrier board (ESP32-S3-DevKitC-1-N8R8)
# =============================================================================
#  Merged on top of prj.conf automatically by board name.
#
#  Headless: the pin budget in Board/Design.md spends all 23 usable GPIOs and
#  has no display on it, so ui.c compiles to its stub and the operator
#  interface is the web dashboard plus the UART console.
#
#  PSRAM is NOT set here - it comes from the snippet, which also brings the
#  matching devicetree change:
#      west build ... -S psram-8M
#  The upstream board file is the N8 variant (8 MB flash, no PSRAM); the
#  module on this board is the N8R8.

CONFIG_DISPLAY=n
CONFIG_LVGL=n

# The console is UART0 through the DevKitC's CP2102 bridge (GPIO43/44), which
# is how the upstream board file has it. Native USB (GPIO19/20) is unused.
CONFIG_UART_CONSOLE=y

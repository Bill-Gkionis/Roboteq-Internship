# =============================================================================
#  esp32s3_lcd_1_47b - the bench dev kit, and the only board with a screen
# =============================================================================
#  Merged on top of prj.conf automatically by board name.  The carrier board
#  has no display, so none of this is in the shared config.

# --- display panel + LVGL ----------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768
CONFIG_LV_Z_SHELL=n
CONFIG_LV_USE_LOG=n
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
# The ST7789 wants big-endian pixels; LVGL renders little-endian.
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_Z_VDB_SIZE=16
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_AUTO_INIT=y
# Widgets the three screens actually use.  Everything else stays off to keep
# the flash and RAM cost of the panel small.
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_QRCODE=y
CONFIG_LV_USE_TABVIEW=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
# LV_Z_KEYPAD_INPUT turns itself on when the devicetree has a
# zephyr,lvgl-keypad-input node, so it is not set here.
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# =============================================================================
#  DJC calorimeter firmware - Kconfig
# =============================================================================
#  Grouped the same way the source tree is.  Where a line is load-bearing (i.e.
#  removing it silently breaks something rather than failing the build) the
#  reason is written next to it.
# =============================================================================

# --- core kernel -------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_INIT_STACKS=y

# --- FLOATING POINT: both lines, or silent corruption ------------------------
# Without FPU_SHARING the FP registers are NOT saved across a context switch,
# so two threads doing float maths quietly corrupt each other's results.  The
# control law and the UI both do float maths, so both lines are mandatory.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
# Without this, "%f" in a log line prints nothing at all.  Classic.
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- structure ---------------------------------------------------------------
# smf gives the supervisor a real hierarchical state machine, so FAULT can be a
# parent state that any child falls into with one exit path.
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y

# --- persistence: every [cal] value lives here, never in the image -----------
# This is what makes "commissioning values override computed estimates"
# mechanically true instead of aspirational, and it means re-calibrating never
# requires a reflash.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- peripherals -------------------------------------------------------------
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_SENSOR=y

CONFIG_TMP11X=y        # chamber temperatures (TMP117 is register-compatible)
CONFIG_INA2XX=y        # rail metering framework
CONFIG_INA226=y        # ... the two heater rails
CONFIG_INA3221=y       # ... and the three aux rails in one part
CONFIG_MAX31865=y      # water dT pair (Pt100 -> SPI)
CONFIG_PCNT_ESP32=y    # flow sensor pulse counter
CONFIG_I2C_TCA954X=y   # the chamber probes sit behind a TCA9548A
# The mux's channel devices must come up AFTER its root device, and both
# default to CONFIG_I2C_INIT_PRIORITY, which makes the driver's own
# BUILD_ASSERT fail.  The sensors behind them init at SENSOR_INIT_PRIORITY (90),
# so 51 leaves plenty of room between the three layers.
CONFIG_I2C_TCA954X_ROOT_INIT_PRIO=50
CONFIG_I2C_TCA954X_CHANNEL_INIT_PRIO=51

# --- safety ------------------------------------------------------------------
# The watchdog is fed by the safety thread, and only if the control thread has
# checked in.  A hung control loop therefore resets the board, and the external
# gate pull-downs make reset mean "heaters off".
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_REBOOT=y

# --- console / diagnostics ---------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y    # logging must never block the control thread
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=256

# --- panel -------------------------------------------------------------------
# The display and LVGL are NOT here: they live in
# boards/esp32s3_lcd_1_47b_esp32s3_procpu.conf, because only that board has a
# screen.  The carrier board's pin budget (Board/Design.md) has no display on
# it, so its build is headless and ui.c compiles to a stub.
#
# CONFIG_INPUT stays here: gpio-keys is how the BOOT button reaches LVGL on the
# dev kit, and it costs a handful of bytes on a board with no buttons.
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y

# --- network: the HTTP/WebSocket dashboard -----------------------------------
# LAN only, never internet exposed.  Read-only telemetry is open on that LAN;
# the command endpoint takes a token shown on the panel (see iot.c).
#
# WI-FI IS NOT ENABLED HERE - it lives in wifi.conf.  Reason: CONFIG_WIFI_ESP32
# hard-selects MBEDTLS, and mbedtls in this Zephyr revision needs the
# `tf-psa-crypto` module, which this workspace deliberately filters out.  With
# the split below, the whole server (routes, JSON, WebSocket push) is compiled
# and linked in every build, and turning the radio on is one extra fragment
# plus one module fetch.  See README.md.
#
#   west build ... -- -DEXTRA_CONF_FILE=wifi.conf
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=16
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="calorimeter"

CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_MAX_CLIENTS=3
CONFIG_HTTP_SERVER_STACK_SIZE=8192
# The WebSocket push lives in wifi.conf too: the WebSocket library selects
# PSA_CRYPTO for the Sec-WebSocket-Accept handshake hash, which pulls in
# mbedtls and therefore the same tf-psa-crypto module.  Without it the
# dashboard polls /api/state once a second instead, which for a 1 Hz
# instrument is not a downgrade worth a module dependency - the page uses the
# socket when it is offered and falls back on its own.
CONFIG_JSON_LIBRARY=y
CONFIG_ZVFS_POLL_MAX=16

# --- misc --------------------------------------------------------------------
CONFIG_POSIX_API=y
CONFIG_EVENTFD=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_ESP_SPIRAM=y

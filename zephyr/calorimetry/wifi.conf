# =============================================================================
#  wifi.conf - turns the radio on.
# =============================================================================
#  Use with:
#     west build ... -- -DEXTRA_CONF_FILE=wifi.conf -DBOARD_ROOT=...
#
#  PREREQUISITE, once, in ~/roboteq/zephyrproject:
#
#     west config manifest.project-filter -- \
#         "-.*,+hal_espressif,+mbedtls,+lvgl,+mcuboot,+tf-psa-crypto"
#     west update --narrow -o=--depth=1 tf-psa-crypto
#
#  Why: CONFIG_WIFI_ESP32 hard-selects MBEDTLS
#  (zephyr/drivers/wifi/esp32/Kconfig.esp32:15), and mbedtls at this revision
#  has been split - its CMakeLists.txt pulls in the separate `tf-psa-crypto`
#  repository for the PSA crypto core.  Without that module the build stops at
#  "TF-PSA-Crypto target tfpsacrypto does not exist".
#
#  The Espressif radio blobs are already fetched in this workspace
#  (`west blobs fetch hal_espressif` was run), so nothing else is needed.
# =============================================================================

CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONNECTION_MANAGER=y

# The Wi-Fi driver and the TCP stack both want more room than the defaults.
CONFIG_HEAP_MEM_POOL_SIZE=65536

# WebSocket push (server-initiated, one connection instead of a poll per
# second).  Selects PSA_CRYPTO -> mbedtls -> tf-psa-crypto, which is the same
# module the radio needs, so it comes along for free once that is fetched.
CONFIG_HTTP_SERVER_WEBSOCKET=y
CONFIG_WEBSOCKET_MAX_CONTEXTS=3
